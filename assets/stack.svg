<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="242" viewBox="0 0 1200 242" role="img" aria-label="Tech Arsenal: Python, JavaScript, HTML5, CSS3, FastAPI, scikit-learn, pandas, NumPy, Random Forest, C++, PowerShell, Android, Git, REST APIs, Jupyter">
  <title>Tech Arsenal</title>

  <defs>
    <linearGradient id="acck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3d81"/>
      <stop offset="55%" stop-color="#ffb340"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="surfk" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#160d22"/>
      <stop offset="100%" stop-color="#0a0611"/>
    </linearGradient>
    <radialGradient id="blobk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3d81" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff3d81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2k" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb340" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb340" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3k" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridk" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#2d1a3d" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
    <filter id="softk" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glowk" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="framek"><rect width="1200" height="242" rx="16"/></clipPath>
  </defs>
  <defs>
    <linearGradient id="cgk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3d81" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffb340" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <style>
    .cl{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:13.5px;font-weight:600;fill:#e8edf7;dominant-baseline:middle}
    .hd{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:17px;font-weight:700;fill:url(#acck)}
