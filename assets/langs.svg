<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-label="Most used languages for GraphicsAndroid65">
  <title>GraphicsAndroid65 — language distribution</title>

  <defs>
    <linearGradient id="accl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3d81"/>
      <stop offset="55%" stop-color="#ffb340"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="surfl" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#160d22"/>
      <stop offset="100%" stop-color="#0a0611"/>
    </linearGradient>
    <radialGradient id="blobl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3d81" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff3d81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb340" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb340" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridl" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#2d1a3d" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
    <filter id="softl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glowl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="framel"><rect width="560" height="240" rx="16"/></clipPath>
  </defs>
  <style>
    .hd{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:17px;font-weight:700;fill:url(#accl)}
    .sub{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:9.5px;fill:#8b97b0;letter-spacing:1.6px}
    .lb{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px;fill:#8b97b0;dominant-baseline:middle}
    .vl{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:12.5px;font-weight:700;fill:#e8edf7;dominant-baseline:middle}
    .sg{transform:scaleX(0);animation:gx .95s cubic-bezier(.2,.9,.2,1) both}
    @keyframes gx{to{transform:scaleX(1)}}
    .rw{opacity:0;animation:sl .55s ease-out both}
    @keyframes sl{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .shine{animation:sh 3.4s ease-in-out 1.3s infinite}
    @keyframes sh{0%{transform:translateX(0);opacity:0}25%{opacity:.75}100%{transform:translateX(500px);opacity:0}}

    .b1{animation:d1 19s ease-in-out infinite}
    .b2{animation:d2 23s ease-in-out infinite}
    .b3{animation:d3 27s ease-in-out infinite}
    @keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,26px)}}
    @keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-30px)}}
    @keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,34px)}}

    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
  <g clip-path="url(#framel)">
    <rect width="560" height="240" fill="url(#surfl)"/>

  <g filter="url(#softl)" opacity="0.95">
    <circle class="b1" cx="100" cy="72" r="148" fill="url(#blobl)"/>
    <circle class="b2" cx="414" cy="163" r="158" fill="url(#blob2l)"/>
    <circle class="b3" cx="268" cy="28" r="120" fill="url(#blob3l)"/>
  </g>
    <rect width="560" height="240" fill="url(#gridl)" opacity="0.30"/>
    <text class="hd" x="30" y="38">Language Distribution</text>
    <text class="sub" x="30" y="56">BY BYTES ACROSS ALL PUBLIC REPOSITORIES</text>
    <g clip-path="url(#framel)">
      <rect x="30" y="74" width="500" height="13" rx="6.5" fill="#0a0611"/>
      <g clip-path="url(#meter)"><rect class="sg" style="animation-delay:0.25s;transform-origin:30.0px 0" x="30.0" y="74" width="325.1" height="13" fill="#ff3d81"/><rect class="sg" style="animation-delay:0.36s;transform-origin:355.1px 0" x="355.1" y="74" width="96.2" height="13" fill="#ffb340"/><rect class="sg" style="animation-delay:0.47s;transform-origin:451.3px 0" x="451.3" y="74" width="51.1" height="13" fill="#7c4dff"/><rect class="sg" style="animation-delay:0.58s;transform-origin:502.4px 0" x="502.4" y="74" width="18.0" height="13" fill="#ffb340"/><rect class="sg" style="animation-delay:0.69s;transform-origin:520.4px 0" x="520.4" y="74" width="3.8" height="13" fill="#ff5c8a"/><rect class="sg" style="animation-delay:0.80s;transform-origin:524.2px 0" x="524.2" y="74" width="2.4" height="13" fill="#5ee7a0"/></g>
      <clipPath id="meter"><rect x="30" y="74" width="500" height="13" rx="6.5"/></clipPath>
      <rect class="shine" x="30" y="74" width="60" height="13" fill="#fff" opacity="0"/>
    </g>

    <g class="rw" style="animation-delay:0.50s">
      <rect x="34" y="111" width="11" height="11" rx="3" fill="#ff3d81"/>
      <text class="lb" x="53" y="118">HTML</text>
      <text class="vl" x="259" y="118" text-anchor="end">65.0%</text>
    </g>
    <g class="rw" style="animation-delay:0.59s">
      <rect x="34" y="132" width="11" height="11" rx="3" fill="#ffb340"/>
      <text class="lb" x="53" y="139">TeX</text>
      <text class="vl" x="259" y="139" text-anchor="end">19.2%</text>
    </g>
    <g class="rw" style="animation-delay:0.68s">
      <rect x="34" y="153" width="11" height="11" rx="3" fill="#7c4dff"/>
      <text class="lb" x="53" y="160">Python</text>
      <text class="vl" x="259" y="160" text-anchor="end">10.2%</text>
    </g>
    <g class="rw" style="animation-delay:0.77s">
      <rect x="290.0" y="111" width="11" height="11" rx="3" fill="#ffb340"/>
      <text class="lb" x="309.0" y="118">C</text>
      <text class="vl" x="515.0" y="118" text-anchor="end">3.6%</text>
    </g>
    <g class="rw" style="animation-delay:0.86s">
      <rect x="290.0" y="132" width="11" height="11" rx="3" fill="#ff5c8a"/>
      <text class="lb" x="309.0" y="139">JavaScript</text>
      <text class="vl" x="515.0" y="139" text-anchor="end">0.8%</text>
    </g>
    <g class="rw" style="animation-delay:0.95s">
      <rect x="290.0" y="153" width="11" height="11" rx="3" fill="#5ee7a0"/>
      <text class="lb" x="309.0" y="160">CSS</text>
      <text class="vl" x="515.0" y="160" text-anchor="end">0.5%</text>
    </g>
    <rect width="560" height="240" rx="16" fill="none" stroke="#ff3d81" stroke-opacity="0.26" stroke-width="1.5"/>
  </g>
</svg>
